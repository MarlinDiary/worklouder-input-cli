name: CI

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.61 test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install declared MSRV
        run: rustup toolchain install 1.61.0 --profile minimal
      - name: Vendor locked dependency graph with stable Cargo
        run: |
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
      - name: Test locked dependency graph
        run: cargo +1.61.0 test --offline --locked

  quality:
    name: Format, test, and lint
    runs-on: macos-latest
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable checks
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test companion bridge reference servers
        run: npm test --prefix companion
      - name: Test live bridge control helpers
        run: node --test scripts/live-bridge-cdp.test.mjs scripts/provider-lock.test.mjs scripts/provider-state.test.mjs
      - name: Verify deterministic Companion integration package
        run: ./scripts/test-companion-package.py
      - name: Verify deterministic sanitized fixtures
        run: ./scripts/verify-sanitized-fixtures.sh
      - name: Verify JSON contracts and unique object keys
        run: ./scripts/verify-json-contracts.py
      - name: Verify per-release compatibility matrix
        run: ./scripts/verify-compatibility-matrix.sh
      - name: Verify curated release notes
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -1)
          ./scripts/extract-release-notes.py CHANGELOG.md "$version" > /tmp/release-notes.md
          test -s /tmp/release-notes.md
      - name: Verify immutable GitHub Actions pins
        run: ./scripts/verify-github-actions-pins.py
      - name: Verify generated completions and command reference
        run: ./scripts/verify-cli-assets.sh
      - name: Verify release archive and Homebrew packaging
        run: ./scripts/test-release-packaging.sh
      - name: Test Input bridge CLI end to end
        run: ./scripts/test-bridge-e2e.sh
      - name: Test delegated firmware update end to end
        run: ./scripts/test-firmware-update-e2e.sh
      - name: Test Input-owned default reset and exact rollback
        run: ./scripts/test-reset-e2e.sh
      - name: Test delegated bootloader recovery and exact config restore
        run: ./scripts/test-recovery-e2e.sh
      - name: Test Codex bridge CLI end to end
        run: ./scripts/test-codex-bridge-e2e.sh
      - name: Test authenticated global doctor readiness
        run: ./scripts/test-doctor-readiness-e2e.sh
      - name: Test four-authority transactions and rollback
        run: ./scripts/test-transaction-e2e.sh
      - name: Test ambiguous provider-error rollback
        run: ./scripts/test-transaction-rollback-e2e.sh
