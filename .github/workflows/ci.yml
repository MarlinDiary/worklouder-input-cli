name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.61 test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install declared MSRV
        run: rustup toolchain install 1.61.0 --profile minimal
      - name: Vendor locked dependency graph with stable Cargo
        run: |
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
      - name: Test locked dependency graph
        run: cargo +1.61.0 test --offline --locked

  quality:
    name: Format, test, and lint
    runs-on: macos-latest
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - uses: actions/checkout@v4
      - name: Install stable checks
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test companion bridge reference servers
        run: npm test --prefix companion
      - name: Verify deterministic sanitized fixtures
        run: ./scripts/verify-sanitized-fixtures.sh
      - name: Verify generated completions and command reference
        run: ./scripts/verify-cli-assets.sh
      - name: Test Input bridge CLI end to end
        run: ./scripts/test-bridge-e2e.sh
      - name: Test delegated firmware update end to end
        run: ./scripts/test-firmware-update-e2e.sh
      - name: Test Codex bridge CLI end to end
        run: ./scripts/test-codex-bridge-e2e.sh
      - name: Test four-authority transactions and rollback
        run: ./scripts/test-transaction-e2e.sh
      - name: Test ambiguous provider-error rollback
        run: ./scripts/test-transaction-rollback-e2e.sh
