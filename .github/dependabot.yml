version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    # Direct and transitive Rust versions are deliberately pinned to Rust 1.61.
    # Disable scheduled version PRs while keeping Dependabot security updates.
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /companion
    schedule:
      interval: monthly
    groups:
      companion-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
